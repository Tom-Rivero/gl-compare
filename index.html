<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Comparateur GL</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="home">
  <header class="top">
    <h1 data-i18n="home.title"></h1>
    <a class="icon-btn" href="#echauffement" data-i18n-aria="nav.warmup">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"/></svg>
    </a>
    <a class="icon-btn" href="#parametres" data-i18n-aria="nav.settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </header>
  <a class="summary-line" id="summaryLine" href="#parametres"></a>

  <section class="card" data-i18n-aria="athletes">
    <div id="profiles"></div>
    <button id="add" class="add" type="button" data-i18n="add"></button>
  </section>

  <section class="card ranking" id="ranking" hidden>
    <div class="ranking-head">
      <h2 data-i18n="ranking"></h2>
      <select id="scenario" data-i18n-aria="scenario.aria">
        <option value="min" data-i18n="scenario.min"></option>
        <option value="max" data-i18n="scenario.max"></option>
        <option value="best" data-i18n="scenario.best"></option>
        <option value="worst" data-i18n="scenario.worst"></option>
      </select>
    </div>
    <div id="rankingBody"></div>
  </section>

  <section class="card table-card">
    <div class="scroll">
      <table id="table">
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<main id="settingsPage" hidden>
  <header class="top">
    <a class="icon-btn back" href="#" data-i18n-aria="nav.back">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 data-i18n="nav.settings"></h1>
  </header>

  <section class="card settings" data-i18n-aria="nav.settings">
    <label><span data-i18n="s.sex"></span>
      <select id="sex">
        <option value="M" data-i18n="sex.M"></option>
        <option value="F" data-i18n="sex.F"></option>
      </select>
    </label>
    <label><span data-i18n="s.equipment"></span>
      <select id="equipment">
        <option value="classic" data-i18n="equipment.classic"></option>
        <option value="equipped" data-i18n="equipment.equipped"></option>
      </select>
    </label>
    <label><span data-i18n="s.unit"></span>
      <select id="unit">
        <option value="kg">kg</option>
        <option value="lb">lb</option>
      </select>
    </label>
    <label><span data-i18n="s.step"></span>
      <select id="step"></select>
    </label>
    <label><span data-i18n="s.mode"></span>
      <select id="mode">
        <option value="gl" data-i18n="mode.gl"></option>
        <option value="total" data-i18n="mode.total"></option>
      </select>
    </label>
    <label><span data-i18n="s.lang"></span>
      <select id="lang">
        <option value="auto" data-i18n="lang.auto"></option>
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
      </select>
    </label>
  </section>
  <section class="card">
    <h2 data-i18n="readTable"></h2>
    <p class="hint" id="hint"></p>
  </section>
</main>

<main id="warmupPage" hidden>
  <header class="top">
    <a class="icon-btn back" href="#" data-i18n-aria="nav.back">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 data-i18n="nav.warmup"></h1>
  </header>

  <div class="tabs" role="tablist" id="liftTabs">
    <button type="button" role="tab" data-lift="squat" data-i18n="lift.squat"></button>
    <button type="button" role="tab" data-lift="bench" data-i18n="lift.bench"></button>
    <button type="button" role="tab" data-lift="deadlift" data-i18n="lift.deadlift"></button>
  </div>

  <section class="card">
    <div class="wu-top">
      <label><span data-i18n="wu.start"></span>
        <input id="wuStart" type="time">
      </label>
      <label><span data-i18n="wu.opener"></span> (<span class="unit"></span>)
        <input id="wuOpener" type="number" inputmode="decimal" step="any" min="0">
      </label>
    </div>
    <p class="wu-begin" id="wuBegin"></p>
    <div class="wu-row wu-labels" aria-hidden="true">
      <span>#</span><span data-i18n="wu.col.load"></span><span data-i18n="wu.col.reps"></span><span data-i18n="wu.col.rest"></span><span data-i18n="wu.col.time"></span><span></span>
    </div>
    <div id="wuSets"></div>
    <div class="wu-row wu-opener" id="wuOpenerRow"></div>
    <button id="wuAdd" class="add" type="button" data-i18n="wu.add"></button>
  </section>
  <p class="hint" data-i18n="wu.hint"></p>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
