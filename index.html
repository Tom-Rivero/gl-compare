<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Comparateur GL</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="home">
  <header class="top">
    <h1>Comparateur d'indice GL (IPF)</h1>
    <a class="icon-btn" href="#parametres" aria-label="Paramètres">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </header>
  <a class="summary-line" id="summaryLine" href="#parametres"></a>

  <section class="card" aria-label="Athlètes">
    <div id="profiles"></div>
    <button id="add" class="add" type="button">+ Ajouter un concurrent</button>
  </section>

  <section class="card ranking" id="ranking" hidden>
    <div class="ranking-head">
      <h2>Classement</h2>
      <select id="scenario" aria-label="Scénario de deadlift">
        <option value="min">Tous au DL min</option>
        <option value="max">Tous au DL max</option>
        <option value="best">Moi max, eux min</option>
        <option value="worst">Moi min, eux max</option>
      </select>
    </div>
    <div id="rankingBody"></div>
  </section>

  <section class="card table-card">
    <div class="scroll">
      <table id="table">
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<main id="settingsPage" hidden>
  <header class="top">
    <a class="icon-btn" href="#" id="back" aria-label="Retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>Paramètres</h1>
  </header>

  <section class="card settings" aria-label="Paramètres">
    <label>Sexe
      <select id="sex">
        <option value="M">Homme</option>
        <option value="F">Femme</option>
      </select>
    </label>
    <label>Équipement
      <select id="equipment">
        <option value="classic">Classique (raw)</option>
        <option value="equipped">Équipé</option>
      </select>
    </label>
    <label>Unité
      <select id="unit">
        <option value="kg">kg</option>
        <option value="lb">lb</option>
      </select>
    </label>
    <label>Incrément
      <select id="step"></select>
    </label>
    <label>Comparer au
      <select id="mode">
        <option value="gl">Points GL</option>
        <option value="total">Total (catégorie)</option>
      </select>
    </label>
  </section>
  <section class="card">
    <h2>Lire le tableau</h2>
    <p class="hint" id="hint"></p>
  </section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
