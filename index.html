<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Comparateur GL</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #15181d;
    --muted: #6b7280;
    --border: #dfe2e7;
    --a: #2563eb;
    --a-soft: #dbe7ff;
    --b: #dc2626;
    --b-soft: #fde0e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418;
      --card: #1b1f25;
      --text: #eef0f3;
      --muted: #9aa3ae;
      --border: #2d333b;
      --a: #6ea2ff;
      --a-soft: #1d3157;
      --b: #ff7b7b;
      --b-soft: #4a2020;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 12px max(12px, env(safe-area-inset-left)) 32px max(12px, env(safe-area-inset-right));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 4px 0 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .profiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .profile h2 { font-size: .95rem; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .profile h2 input { padding: 4px 6px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .profile.a .dot { background: var(--a); }
  .profile.b .dot { background: var(--b); }
  label { display: block; font-size: .78rem; color: var(--muted); margin: 8px 0 3px; }
  input, select {
    width: 100%;
    font: inherit;
    font-size: 16px; /* évite le zoom auto sur iPhone */
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--a); outline-offset: -1px; }
  .range { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .hint { font-size: .78rem; color: var(--muted); margin: 8px 0 0; }
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: .82rem; text-align: center; }
  .summary strong { display: block; font-size: 1.1rem; }
  .summary .sa strong { color: var(--a); }
  .summary .sb strong { color: var(--b); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; table-layout: fixed; }
  thead th {
    position: sticky; top: 0;
    background: var(--card);
    font-size: .85rem;
    font-weight: 700;
    padding: 9px 4px;
    border-bottom: 1px solid var(--border);
    z-index: 1;
  }
  thead th:first-child { border-top-left-radius: 12px; color: var(--a); }
  thead th:last-child { border-top-right-radius: 12px; color: var(--b); }
  td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border); vertical-align: top; }
  td + td { border-left: 1px solid var(--border); }
  .dl { font-weight: 700; }
  .gl { font-size: 1.15rem; font-weight: 700; }
  td.ca .gl { color: var(--a); }
  td.cb .gl { color: var(--b); }
  .tot { color: var(--muted); font-size: .75rem; }
  .need {
    display: inline-block;
    margin-top: 4px;
    font-size: .72rem;
    padding: 2px 6px;
    border-radius: 6px;
    background: var(--bg);
    color: var(--muted);
  }
  /* L'adversaire ne peut pas passer devant dans sa plage */
  td.ca .need.safe { background: var(--a-soft); color: var(--a); font-weight: 600; }
  td.cb .need.safe { background: var(--b-soft); color: var(--b); font-weight: 600; }
  /* L'adversaire est devant même avec son minimum */
  td.ca .need.lost { background: var(--b-soft); color: var(--b); }
  td.cb .need.lost { background: var(--a-soft); color: var(--a); }
  .table-card { padding: 0; }
  .empty { padding: 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Comparateur d'indice GL (IPF)</h1>

  <section class="card">
    <div class="profiles">
      <div class="profile a">
        <h2><span class="dot"></span><input id="nameA" value="Athlète A" aria-label="Nom profil A"></h2>
        <label for="bwA">Poids de corps (kg)</label>
        <input id="bwA" type="number" inputmode="decimal" step="0.01" min="30" placeholder="ex. 82.4">
        <label for="stA">Sous-total SQ+BP (kg)</label>
        <input id="stA" type="number" inputmode="decimal" step="0.5" min="0" placeholder="ex. 420">
        <label>Deadlift min / max (kg)</label>
        <div class="range">
          <input id="dlMinA" type="number" inputmode="decimal" step="2.5" min="0" value="240" aria-label="Deadlift min A">
          <input id="dlMaxA" type="number" inputmode="decimal" step="2.5" min="0" value="270" aria-label="Deadlift max A">
        </div>
      </div>
      <div class="profile b">
        <h2><span class="dot"></span><input id="nameB" value="Athlète B" aria-label="Nom profil B"></h2>
        <label for="bwB">Poids de corps (kg)</label>
        <input id="bwB" type="number" inputmode="decimal" step="0.01" min="30" placeholder="ex. 89.7">
        <label for="stB">Sous-total SQ+BP (kg)</label>
        <input id="stB" type="number" inputmode="decimal" step="0.5" min="0" placeholder="ex. 435">
        <label>Deadlift min / max (kg)</label>
        <div class="range">
          <input id="dlMinB" type="number" inputmode="decimal" step="2.5" min="0" value="240" aria-label="Deadlift min B">
          <input id="dlMaxB" type="number" inputmode="decimal" step="2.5" min="0" value="270" aria-label="Deadlift max B">
        </div>
      </div>
    </div>
    <label for="cat">Catégorie</label>
    <select id="cat">
      <option value="classic">Classique (raw), hommes</option>
      <option value="equipped">Équipé, hommes</option>
    </select>
    <p class="hint">Paliers de 2,5 kg. Sous chaque indice : le deadlift minimum dont l'adversaire a besoin pour passer devant.
      Coloré à la couleur de l'athlète = l'adversaire ne peut pas le battre dans sa plage ;
      à la couleur de l'adversaire = il est devant même avec son minimum.</p>
  </section>

  <section class="card summary" id="summary" hidden></section>

  <section class="card table-card">
    <table>
      <thead>
        <tr><th id="thA">A</th><th id="thB">B</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>

<script>
  // IPF GL points (2020) : GL = Total × 100 / (A − B·e^(−C·PdC))
  const COEFS = {
    classic:  { A: 1199.72839, B: 1025.18162, C: 0.00921 },
    equipped: { A: 1236.25115, B: 1449.21864, C: 0.01644 },
  };
  const STEP = 2.5;
  const MAX_ROWS = 200;
  const FIELDS = ["nameA", "bwA", "stA", "dlMinA", "dlMaxA", "nameB", "bwB", "stB", "dlMinB", "dlMaxB", "cat"];
  const STORE_KEY = "gl-compare-v2";
  const $ = id => document.getElementById(id);

  function denom(bw, cat) {
    const k = COEFS[cat];
    return k.A - k.B * Math.exp(-k.C * bw);
  }
  function gl(total, bw, cat) {
    const d = denom(bw, cat);
    return d > 0 ? total * 100 / d : NaN;
  }

  const num = id => {
    const v = parseFloat(String($(id).value).replace(",", "."));
    return Number.isFinite(v) ? v : NaN;
  };
  const fmt = v => Number.isFinite(v) ? v.toFixed(2) : "–";
  const fmtKg = v => (Math.round(v * 10) / 10).toString().replace(".", ",");
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Lit un profil ; renvoie null s'il est incomplet
  function profile(s) {
    const p = {
      name: $("name" + s).value.trim() || s,
      bw: num("bw" + s),
      st: num("st" + s),
      lo: num("dlMin" + s),
      hi: num("dlMax" + s),
    };
    if (!(p.bw > 0) || !(p.st >= 0) || !Number.isFinite(p.lo) || !Number.isFinite(p.hi)) return null;
    if (p.lo > p.hi) [p.lo, p.hi] = [p.hi, p.lo];
    p.lo = Math.ceil(p.lo / STEP - 1e-9) * STEP; // aligne sur un multiple de 2,5 kg
    p.dls = [];
    for (let dl = p.lo; dl <= p.hi + 1e-9 && p.dls.length < MAX_ROWS; dl += STEP) p.dls.push(dl);
    return p;
  }

  // Plus petit deadlift (multiple de 2,5) donnant à l'adversaire un GL strictement supérieur à target
  function deadliftToBeat(target, opp, cat) {
    const d = denom(opp.bw, cat);
    if (!(d > 0)) return NaN;
    let dl = Math.max(0, Math.ceil(((target * d / 100) - opp.st) / STEP - 1e-9) * STEP);
    while (gl(opp.st + dl, opp.bw, cat) <= target) dl += STEP;
    return dl;
  }

  function cell(p, opp, dl, cls, cat) {
    if (!p || dl == null) return `<td class="${cls}"></td>`;
    const g = gl(p.st + dl, p.bw, cat);
    let need = "";
    if (opp && Number.isFinite(g)) {
      const n = deadliftToBeat(g, opp, cat);
      const state = n > opp.hi ? "safe" : n <= opp.lo ? "lost" : "";
      need = `<div><span class="need ${state}">${esc(opp.name)} ≥ ${fmtKg(n)}</span></div>`;
    }
    return `<td class="${cls}">
      <div class="dl">DL ${fmtKg(dl)}</div>
      <div class="gl">${fmt(g)}</div>
      <div class="tot">Total ${fmtKg(p.st + dl)} kg</div>
      ${need}
    </td>`;
  }

  function render() {
    const cat = $("cat").value;
    const A = profile("A"), B = profile("B");
    $("thA").textContent = $("nameA").value.trim() || "A";
    $("thB").textContent = $("nameB").value.trim() || "B";

    const tbody = $("rows");
    const summary = $("summary");
    if (!A && !B) {
      tbody.innerHTML = `<tr><td colspan="2" class="empty">Renseigne le poids de corps, le sous-total et la plage de deadlift d'au moins un profil.</td></tr>`;
      summary.hidden = true;
      return;
    }

    const rows = Math.max(A ? A.dls.length : 0, B ? B.dls.length : 0);
    let html = "";
    for (let i = 0; i < rows; i++) {
      html += `<tr>${cell(A, B, A ? A.dls[i] : null, "ca", cat)}${cell(B, A, B ? B.dls[i] : null, "cb", cat)}</tr>`;
    }
    tbody.innerHTML = html;

    if (A && B && A.dls.length && B.dls.length) {
      const range = p => {
        const g1 = gl(p.st + p.dls[0], p.bw, cat);
        const g2 = gl(p.st + p.dls[p.dls.length - 1], p.bw, cat);
        return `${fmt(g1)} → ${fmt(g2)}`;
      };
      summary.hidden = false;
      summary.innerHTML = `
        <div class="sa"><strong>${range(A)}</strong>GL de ${esc(A.name)}</div>
        <div class="sb"><strong>${range(B)}</strong>GL de ${esc(B.name)}</div>`;
    } else {
      summary.hidden = true;
    }
  }

  function save() {
    try {
      const data = {};
      FIELDS.forEach(id => data[id] = $(id).value);
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
      FIELDS.forEach(id => { if (data[id] != null) $(id).value = data[id]; });
    } catch (e) {}
  }

  load();
  FIELDS.forEach(id => $(id).addEventListener("input", () => { render(); save(); }));
  render();
</script>
</body>
</html>
